name: Publish stable addon

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      FACTORIO_API_KEY:
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the immutable stable release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --json isDraft,isPrerelease --jq 'if (.isDraft or .isPrerelease) then error("Expected a published stable release") else . end'
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main
          git checkout --detach "refs/tags/$TAG"
      - name: Build and validate the tagged addon
        run: |
          python3 tools/package.py
          python3 tools/validate_package.py --tag "$TAG"
      - name: Attach identical assets, including on retries
        run: |
          mkdir -p build/published
          gh release view "$TAG" --json assets --jq '.assets[].name' > build/assets.txt
          for file in build/dist/*.zip build/dist/SHA256SUMS; do
            name="${file##*/}"
            if grep -Fxq "$name" build/assets.txt; then
              gh release download "$TAG" --pattern "$name" --dir build/published
              cmp "$file" "build/published/$name"
            else
              gh release upload "$TAG" "$file"
            fi
          done
      - name: Publish to Factorio when connected
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
          FACTORIO_LICENSE_ID: ${{ vars.FACTORIO_LICENSE_ID }}
        run: |
          if [ -z "$FACTORIO_API_KEY" ]; then
            echo 'Portal not connected; GitHub release is complete.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/publish_mod.py --tag "$TAG"
