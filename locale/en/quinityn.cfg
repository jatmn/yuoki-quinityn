[tips-and-tricks-item-description]
quinityn-briefing=Quinityn appears in YuokiTani's original 2015 stories as a Yuoki Industries contract world. This addon imagines the industrial landscape left behind. Unicomp stains exposed rocks purple-grey, while generations of industrial fallout settle in their cracks. That flyash becomes evidence for science and a reason to reclaim the polluted atmosphere.\n\nResearch its discovery and fly from Nauvis. Physically landing a character unlocks the field survey for your entire force. Viewing the surface remotely does not count. Yuoki research then applies on every world.\n\nYou may arrive empty-handed. The starting plateau has N4, F7 and a unicomp inlet. Existing vanilla research is retained; local production can bootstrap from no imported items after discovery. No spawn-changing mod is required.\n\nThese chapters appear as you reach their relevant technologies and remain in Tips and Tricks for reference.
quinityn-bootstrap=Mine the irregular N4/F7 deposits near your landing site. Each holds roughly 125,000–150,000 units. Nearby clustered [entity=quinityn-wreck] provide extra salvage. Use [recipe=quinityn-hand-sort] (the salvage icon) in the Yuoki crafting tab to sort wreck salvage into N4, F7, stone and wood. Hand-sort initial iron ore, copper ore, stone, coal and timber. These emergency recipes cannot be automated.\n\nBuild [item=quinityn-burner-separator], find the natural unicomp coastline, and connect an offshore pump to its input. Burn raw [item=y-res2] (1 MJ), wood or coal. This primitive Cimota separates 100 water every 4 seconds without electricity; [recipe=quinityn-water] is unchanged. Crafting the machine completes [technology=quinityn-surplus]: use [recipe=quinityn-stone-to-uc] or [recipe=quinityn-wood-to-uc], then [recipe=quinityn-uc-to-coal], [recipe=quinityn-uc-to-iron] or [recipe=quinityn-uc-to-copper] in [entity=quinityn-burner-separator] before any Quinityn science. Feed a boiler and steam engine, then build your first labs, crusher and form press. There is no artificial starter pond.\n\nMine [entity=quinityn-big-rock] or [entity=quinityn-huge-rock] for stone and a little [item=y-pol-waste]. Your first mined rock reveals [technology=quinityn-industrial-science], even before you can build its factory. Save 100 ash for the first 100 science packs: 60 fund [technology=quinityn-power] and 40 fund the separate [technology=quinityn-air-scrubbing] unlock. Rocks are finite samples; running a Fatmice supplies the ongoing science demand.\n\nThe 80-tile dry core protects the initial deposits; the coastline beyond it follows the natural warped terrain.
quinityn-unicomp=[font=default-bold]There is no natural water[/font]\nPlace [entity=offshore-pump] at the purple sea. Its output is [fluid=y-liquid-uc2], not water. Pipe it into [entity=quinityn-burner-separator], select [recipe=quinityn-water], insert raw F7, wood or coal, and connect the output to your boiler. The recipe consumes 1 unicomp fluid to produce 100 water in 4 seconds.\n\nSeparate the input and output pipe networks. A boiler cannot use unicomp. Expand separator capacity when crushers and farms also need water. The same [entity=quinityn-burner-separator] can later run [technology=quinityn-surplus] conversions from surplus stone or wood; water separation stays separate.\n\n[font=default-bold]Disposal[/font]\nPoint an inserter at a unicomp tile to dissolve surplus items permanently, as with Vulcanus lava. Filter it carefully. Dumping items does not recover unicomp and does not consume the sea. Ordinary landfill and normal foundations cannot cover unicomp. Research [technology=quinityn-foundation] and use [item=quinityn-foundation] to expand.
quinityn-materials=Craft [item=quinityn-burner-separator] to unlock [item=y-crusher] and wet N4/F7 crushing. Supply water from unicomp separation.\n\nCrush 50 N4 for [technology=quinityn-pressing], then produce 30 refined N4 for [technology=quinityn-compacting]. Crushed F7 opens [technology=quinityn-alloying]. Durotal blocks lead to [technology=quinityn-structures], while Orange Stuff leads to [technology=quinityn-electronics].\n\nMake basic chips to open [technology=quinityn-basic-factory]. Press Fuelnium for [technology=quinityn-fuel-processing] and its Technic Sign byproduct. Mine an ash-coated rock to reveal [technology=quinityn-industrial-science], then build the first factory to use its recipes. Reserve [item=y-pol-waste] from rocks for the first batches; each five bottles needs five flyash. Later lab research consumes these bottles. Each milestone has its own guide entry.
quinityn-power=The first steam network starts your factory. [technology=quinityn-power] requires Quinityn science and opens basic coal fuel, wooden briquettes, the emergency generator, plated heat exchangers and early fuel-to-electricity. [technology=quinityn-compressed-fuel], [technology=quinityn-mixed-fuel] and [technology=quinityn-residue-fuel] split denser fuels. [technology=quinityn-solar-dish] and [technology=quinityn-solar-collector] split solar steps. [technology=quinityn-field-repair] covers Durotal repair tools; maintenance workshops stay later.\n\n[technology=quinityn-energy-storage] opens disposable batteries and the first small accumulator. [technology=quinityn-accumulator-capacity], [technology=quinityn-flywheel-storage] and [technology=quinityn-high-flow-storage] split larger storage devices. [technology=quinityn-advanced-generation] opens the small Generator-S; boiler, turbine, water generator and larger Generator-S sizes have their own researches.\n\nBuffer fuel and water before expanding your electric load. A researched machine can still require a material made in a later discipline: inspect its ingredients in Factoriopedia.\n\nMF-only generators require Mechanical Force fluid from the Engines chain; water or steam is not a universal substitute.\n\nIndustrial tanks, pipes and lights follow [technology=quinityn-plant-infrastructure]. Crystal accumulators become practical after crystal processing and [technology=quinityn-advanced-storage].
quinityn-cimota=Build [item=y-atomic-constructor] from an assembling machine 2, crusher, press and reactor fuel.\n\nPump [fluid=y-liquid-uc2] into the Cimota and choose [recipe=y-liquid2uc] to recover solid [item=y-unicomp-a2]. The existing Yuoki conversion is 5 fluid to 25 solid UC-A2. Reconstruct ore, timber and crude oil with the original Yuoki recipes. Ocean material is abundant; machinery, power and logistics determine throughput.\n\n[font=default-bold]No oil well required[/font]\nResearch Oil gathering, then make 80 crude oil with [recipe=y-uc2crudeoil]. [technology=quinityn-oil-processing] completes normal Oil processing. You can now construct refineries and chemical plants and progress toward plastic, sulfur, acid, advanced circuits and chemical science.\n\nThis alternate trigger exists because Quinityn has no crude oil deposit to mine.
quinityn-engines=Mechanical Force, [fluid=y-mechanical-force], represents the Engines power transmission system. Its temperature matters to downstream machinery and generators.\n\nBuild the machine parts and a suitable MF source, then connect compatible engines, gearboxes and generators with pipes. Select the conversion recipe and supply its exact fuel, water or lubricant requirement.\n\nElectric motors consume grid energy to supply MF. Fuel engines provide another route. Turbines produce condensate: drain or reuse it so a full output does not stop the turbine.\n\nDo not assume an engine icon means it generates electricity directly. Follow fluid input/output arrows in Factoriopedia and use a generator designed for that fluid and temperature. Quantrinum reactors belong to the later quantum stage.\n\nThe first solid-fuel engine and transmission unlock here. Fatmice and its small electric motor have their own earlier [technology=quinityn-air-scrubbing] unlock. [technology=quinityn-air-filters] follows this research and ore washing, adding reusable filters and cleaning.\n\nSurplus [item=y-pol-waste] can use [recipe=y-waste-condense]: 150 ash produces 2 mixed fuel and a Green Sign. [recipe=y_mixedfuel2rocketfuel] consumes 10 mixed fuel for 1 rocket fuel in a chemical plant (750 ash per rocket fuel). Keep science supplied first. Follow [technology=quinityn-fluid-handling] for containers and [technology=quinityn-advanced-factories] for the Y2-Factory. [technology=quinityn-advanced-engines] unlocks the liquid-fuel and gas engines. [technology=quinityn-medium-electric-motor] unlocks the 350 kW motor, and [technology=quinityn-mf-heat-generator] turns that motor into the 6 MW heat generator. [technology=quinityn-p3-factory] and [technology=quinityn-research-center] are separate later unlocks; obtain Scientific Reputation from production byproducts before the research center is available. Green tubes require [technology=quinityn-advanced-transmission] and [technology=foundry].
quinityn-refining=Yuoki refining expands the factory from ore handling into contaminated-water recovery, emulsions and catalysts. Industrial smelting, including [item=y_smelter], is [technology=quinityn-thermal-smelting].\n\nUse [item=y-dirtwasher] to recover useful fractions and crystals. Read every recipe's outputs before connecting belts and pipes: solids and contaminated water need independent exits.\n\nFollow recovered materials into catalysts and mixers. Keep a buffer for each intermediate so one full output cannot halt an entire chain.\n\nConvert reusable waste where economical. Send truly unwanted solids to a filtered shore inserter. Maintain your clean-water loop separately from contaminated water and unicomp.
quinityn-agriculture=Engines adds its own biology: corn, Vugar, Trifitan, Rabio, vegetable oils, animals and DNA. These are Yuoki production lines, independent of Gleba farming.\n\nBegin with [item=ye_farm], the seed recipes and a steady water supply. Reserve seeds for replanting before processing the harvest. Develop Vugar and corn products into industrial material, synthetic wood, fuel or feed.\n\nThe DNA, meat and fish branches use different inputs; unlock their machine recipes and follow the ingredient links. Some breeding recipes require an initial specimen or trade before they can multiply it.\n\nThe Trade Node becomes available here for the agricultural chain. Large export operations and Laika trade are developed later. Agriculture is useful industry, but it is not an import requirement for your first rocket.\n\nThis first stage opens crops. Animal production follows [technology=quinityn-husbandry]; engineered species progress through [technology=quinityn-genetics], [technology=quinityn-advanced-genetics] and [technology=quinityn-industrial-biology]. [technology=quinityn-packaging] prepares exports.
quinityn-logistics=Yuoki inserters, storage and robot infrastructure support expanding districts. Manufacture the underlying N4/F7 structures and electronic parts before scaling advanced machines.\n\nKeep the water-separation district, MF network, refining and farms supplied independently. Filter shore disposal so science, catalysts, fuel and seed reserves cannot be thrown away accidentally.\n\nBiters can attack transport corridors. Build defended routes between industrial islands and use Quinityn foundations where you need a reliable crossing. This planet does not require elevated rails to reach its first resources.\n\nThis first stage opens storage and basic industrial inserters. Smart inserters follow [technology=quinityn-advanced-logistics]. [technology=quinityn-robotics] unlocks the first roboport and bots; [technology=quinityn-robot-network-expansion] unlocks The 8080. Craft 500 YI Logistikers for [technology=quinityn-robot-production], then fund [technology=quinityn-advanced-robotics] with science. Every robot lab research requires chemical science as well as logistic science.
quinityn-defense=Quinityn is an industrial wasteland: ash, slag, ruined machinery and smog. Its grey-purple rocks preserve settled industrial flyash. Collect samples for science, then research [technology=quinityn-air-scrubbing] to recover ash by cleaning the air. A powered Fatmice consumes water and Mechanical Force; keep the output clear so it continues scrubbing. Filters arrive later through [technology=quinityn-air-filters]. There are no forests, and the contaminated ground and sea absorb almost no pollution. Quinityn has native biters, spitters and worms. Industrial pollution attracts them; this is not a peaceful ruin world.\n\nStart with locally made vanilla ammunition, turrets and walls while developing [technology=quinityn-defense]. Yuoki then provides stronger walls, specialized ammunition, weapons, turrets and equipment.\n\nMatch each turret to its ammunition or fluid. Protect the bootstrap water and fuel lines first: losing them can shut down power and the machines needed to repair your defense.\n\nKeep repair stock and spare ammunition outside production buffers. The infinite plasma research provides an ongoing use for Quinityn science later.\n\nThis first stage opens basic walls, ammunition and the first gun turret. Follow [technology=quinityn-advanced-defense] for stronger turrets, then [technology=quinityn-powered-armor] and successive suit upgrades. Walkers follow [technology=quinityn-walker-1] and [technology=quinityn-walker-2].
quinityn-quantum=Refined N4/F7, crystals and Technic Signs lead into [item=y-atomic-quantum-composer], [item=y-alien-infuser], [item=y-quantrinum] and advanced electronics.\n\nBuild the preceding ore and crystal lines first, then commission the composer and infuser. Supply their actual recipe ingredients; the purple ocean supplies matter, not finished high-tier components.\n\nScale [item=y-chip-2], conductive parts and structural materials for advanced machines and orbital manufacturing. Keep power reserves before starting high-consumption processes.\n\nMerchant reputation and Technic Signs are separate resources. Do not substitute one for the other when a machine or recipe asks for a specific sign.\n\nEach module has its own research. Speed starts at [technology=quinityn-modules], efficiency at [technology=quinityn-efficiency-module], and productivity at [technology=quinityn-productivity-module]. Second tiers add chemical and space science; [technology=quinityn-quantum-modules] adds production science for Mantis-S. Combined and ultimate modules add utility science and follow their component lines. Green Ultimate, Science Baby and YI Quality also require Mastercrafted industry. All module research uses only Nauvis, space and Quinityn science.
quinityn-trade=The [item=y-stargate] is the Laika-Gate, named in the original mod in memory of Laika. Yuoki's trade fiction connects your factory to other worlds with demand for raw materials and manufactured goods.\n\nUse the existing recipes to manufacture exports, earn [item=ypfw_trader_sign] and reputation, and obtain specialized imports. Follow the food and package chains through the Engines Trade Node.\n\nA trade is a recipe with real material costs; inspect both outputs and byproducts. Reputation is not the same as UC-A2. Some profitable loops are part of Yuoki's original design.\n\nYour first rocket can be built without importing resources through either a platform or the trade network.
quinityn-mastery=Mastercrafted machines and ultimate products reward a developed Yuoki economy. They consume the advanced materials and signs earned by preceding industries.\n\nExpand a working chain before replacing every machine with a larger version. Verify its power or MF input, fuel, output capacity and module support.\n\nKeep [item=quinityn-research-data] automated on Quinityn. It is not only a progression item: your endgame mining and plasma technologies consume it indefinitely.
quinityn-orbital=Your launch chain is entirely local: N4/F7 and salvage → plates and structures; unicomp → crude oil → petroleum, plastic, sulfur and acid; advanced circuits → processing units; oil or recovered flyash → mixed fuel → rocket fuel. [recipe=y-waste-condense] and [recipe=y_mixedfuel2rocketfuel] unlock with Mechanical Force engineering; the latter runs in a chemical plant.\n\nFollow the normal rocket-silo technology prerequisites. Make the silo, concrete, electric engines, processing units, low density structures and rocket fuel locally. Supply electricity and assemble the rocket normally. You do not need other-planet resources or trade imports.\n\n[technology=quinityn-orbital] adds [recipe=quinityn-low-density-structure] and [recipe=quinityn-processing-unit], using Durotal structures and Yuoki chips. Vanilla local recipes remain available.\n\nBuild or retain an orbital platform to receive your launch and export science. This mod does not create a rescue platform for you.
quinityn-endgame=[font=default-bold]Keep Quinityn working[/font]\n[item=quinityn-research-data] can only be manufactured on Quinityn. Export it to your research center or import other science to local labs.\n\n[technology=quinityn-mining-productivity] adds 10% mining productivity per level. [technology=quinityn-plasma-damage] adds 10% Yuoki plasma ammunition damage per level. Both are infinite.\n\nEach starts at 1,000 research units. Every unit consumes two Quinityn data packs and one of each standard red, green, blue, purple, yellow and space science pack. Cost grows by 50% every level.\n\nSustained N4/F7 processing, Technic Signs and flyash recovery therefore remain useful after every finite Quinityn technology has been completed.
quinityn-foundation=The purple sea dissolves ordinary fill. [item=landfill] and [item=foundation] cannot cover it. Your starting plateau has enough room to bootstrap, but expansion across liquid requires [item=quinityn-foundation].\n\nAfter [technology=quinityn-refining], research [technology=quinityn-foundation]. Use a Yuoki form press on Quinityn: 2 Durotal structure elements + 1 pressure-proof element + 5 Orange Stuff + 10 stone bricks → 4 foundations in 8 seconds.\n\nThese are a separate item and tile with their own mining return. They retain normal foundation's terrain support and freeze/thaw behavior. They work anywhere normal foundations work, plus unicomp seas. Export them as an alternative for building on other planets.\n\nLeave accessible coastline for offshore pumps and filtered disposal inserters. Covering every inlet would remove the source of your industrial water and matter.

