[entity-description]
quinityn-flyash-rock=Grey-purple stone stained by unicomp. Centuries of industrial fallout have lodged flyash in its cracks. Mine for ordinary rock materials and a small sample of [item=y-pol-waste].
quinityn-dead-tree=A dead tree stained purple by unicomp. Sparse remnants of the life that preceded the industrial wasteland.
quinityn-burner-separator=Burns chemical fuel to separate water from Liquid Unicomp A2 without electricity. Connect an offshore pump to an input and your boiler to an output. Burn raw F7 chunks (1 MJ), wood or coal. Crafting speed: 0.5; 100 water every 4 seconds at 180 kW.
quinityn-wreck=Recoverable remnants of previous industrial contracts. Mine to obtain [item=quinityn-salvage], then use [recipe=quinityn-hand-sort] in the Yuoki crafting tab.

[item-name]
quinityn-salvage=Yuoki industrial salvage
quinityn-research-data=Quinityn industrial research data
quinityn-foundation=Durotal foundation

[item-description]
quinityn-flyash=Industrial particles recovered from Quinityn rocks or the air. Keep your first samples for [recipe=quinityn-research-data]. Research [technology=quinityn-air-scrubbing] to collect a steady supply with a Fatmice Cycle Engine; surplus ash can become mixed fuel and rocket fuel.
quinityn-salvage=Compressed broken gears, Durotal framing and conductive wire. On Quinityn, use [recipe=quinityn-hand-sort] in the Yuoki crafting tab to recover N4, F7, stone and wood. Unlocked on physical arrival.
quinityn-research-data=Practical data from N4, F7, Technic Signs and recovered flyash. Manufactured only in Yuoki factories on Quinityn; consumed by laboratories to recover Yuoki industrial knowledge.
quinityn-foundation=A Quinityn-made alternative to normal foundation. Works on all normal foundation terrain and is the only foundation that can cover unicomp seas. Export it for use on other planets.

