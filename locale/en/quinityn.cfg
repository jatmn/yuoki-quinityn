land-to-unlock=Physically land a character on Quinityn.
bridge=Complete both prerequisite technologies.
oil-processing-effect=Completes Oil processing and unlocks the normal petrochemical progression.
arrival-message=Quinityn field survey complete. Yuoki industry is now available to research. Start with collapsed stockpiles or N4/F7 outcrops. Purple seas contain unicomp, not water: use a burner separator. Items dropped into these seas are destroyed.
