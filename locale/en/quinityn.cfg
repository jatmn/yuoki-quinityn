[technology-description]
planet-discovery-quinityn=Locate Quinityn, the world named in the recovered Yuoki Industries stories. Travel from Nauvis. Landing there opens Yuoki progression for your force; discovering it from orbit does not.
quinityn-arrival=Physically land on Quinityn. Mine N4 and F7 or collapsed stockpiles. Hand-sort ore, carbon and stone, build a furnace, and assemble a primitive Cimota Restructor. Nothing needs to be imported.
quinityn-materials=Build crushers and heat form presses. Convert N4 and F7 into refined materials, build a Yuoki factory to compile industrial research data. Earn Technic Signs from reactor fuel or dedicated technical qualification. Vanilla automation and steel processing support this stage.
quinityn-power=Expand electricity generation, fuel preparation, storage and pipes. Advanced machines may require materials from later disciplines. Steam is your bootstrap; Mechanical Force is your industrial future.
quinityn-cimota=Build a Cimota Restructor. Solidify pumped unicomp, reconstruct raw materials and crude oil, and feed conventional chemistry. Industrial research data comes from the preceding N4/F7 chain.
quinityn-engines=Develop Engines machinery, gearboxes, fluid handling and Mechanical Force networks. MF is a separate fluid-based power system; match temperatures and drain condensate to keep it running.
quinityn-refining=Recover contaminated water and industrial byproducts. Scale fuel and material production through Yuoki chemistry and smelting.
quinityn-agriculture=Grow corn and Vugar, prepare synthetic wood and oils, culture animals, and develop the DNA and fish lines. Water comes from your separator; it is not a natural ocean resource here.
quinityn-logistics=Move your industrial output with Yuoki inserters, storage and robots. Researching this discipline unlocks the designs; their advanced ingredients still require the corresponding production lines.
quinityn-defense=Build Yuoki walls, ammunition, turrets and personal equipment. Pollution attracts native biters. The starting plateau gives you room to build a defense before expanding.
quinityn-quantum=Combine refined materials, crystals and Technic Signs into Quantrinum, advanced electronics, modules and high energy machinery.
quinityn-trade=Connect to the Laika network. Manufacture export packages, earn Merchant Signs and reputation, and trade for specialized materials. Trade is optional for launching a rocket from local resources.
quinityn-mastery=Commission mastercrafted machines and Yuoki ultimate products. This is the mature industrial economy beyond basic survival and orbital access.
quinityn-orbital=Use Durotal structures and Yuoki chips in rocket component production. Standard locally manufactured rocket components are also available through the vanilla technology tree.
quinityn-oil-processing=Reconstruct crude oil in a Cimota Restructor. This completes Oil processing without requiring a crude oil deposit, allowing an entirely local start on Quinityn.
quinityn-mining-productivity=Repeatable endgame research: +10% mining productivity per level. Each research unit consumes two Quinityn industrial research data plus the six standard sciences. Cost grows by 50% per level. Keep Quinityn producing and exporting science throughout the endgame.
quinityn-plasma-damage=Repeatable endgame research: +10% Yuoki plasma ammunition damage per level. Consumes Quinityn industrial research data and the six standard sciences, with 50% greater cost per level. Supports the continuing defense of your industrial empire.
quinityn-foundation=Make foundations locally in Yuoki form presses from Durotal structures, pressure-proof elements, Orange Stuff and stone bricks. Required to expand over unicomp seas. These foundations also cover every terrain supported by ordinary foundations, without requiring Aquilo materials.

