[autoplace-control-descriptions]
quinityn_trees=Sparse purple, dead and decaying tree patches. Adjust patch frequency and coverage, or disable trees.
quinityn_water=Coverage increases the unicomp sea area; scale changes the size of land districts. The landing area retains a winding land connection for ground travel.
quinityn_cliff=Controls cliff frequency and continuity on Quinityn. Fulgora-style cliffs form only on machinery-covered ruined districts, mainly near coasts with occasional inland escarpments. The landing core and a winding passage remain cliff-free.
quinityn_enemy_base=Controls Quinityn biter nest frequency and size independently of Nauvis. Map-generated nests and worms originate on brown slag; later colonies can expand onto any walkable terrain.

[recipe-description]
quinityn-y-waste-condense=Recover fuel from surplus captured pollution: 150 flyash becomes 2 mixed fuel and 1 Green Sign. Reserve ash for Quinityn science first.
quinityn-y_mixedfuel2rocketfuel=Chemical-plant conversion: 10 mixed fuel becomes 1 rocket fuel. Waste condensation supplies mixed fuel from flyash, for a total of 750 ash per rocket fuel.
quinityn-hand-sort=Manually sort one industrial salvage into 2 N4, 2 F7, 2 stone and 1 wood. Available in the Yuoki crafting tab after landing on Quinityn. Hand-crafting only.
quinityn-stone-to-uc=40 stone become 1 UC-A2 in 16 seconds at primitive crafting speed 0.5. Primitive Cimota Restructor only; no Quinityn science.
quinityn-wood-to-uc=40 wood become 1 UC-A2 in 16 seconds at primitive crafting speed 0.5. Primitive Cimota Restructor only; no Quinityn science.
quinityn-uc-to-coal=1 UC-A2 becomes 10 coal in 16 seconds at primitive crafting speed 0.5. Primitive Cimota Restructor only; no Quinityn science.
quinityn-uc-to-iron=1 UC-A2 becomes 10 iron ore in 16 seconds at primitive crafting speed 0.5. Primitive Cimota Restructor only; no Quinityn science.
quinityn-uc-to-copper=1 UC-A2 becomes 10 copper ore in 16 seconds at primitive crafting speed 0.5. Primitive Cimota Restructor only; no Quinityn science.
