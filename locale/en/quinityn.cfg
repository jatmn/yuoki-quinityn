quinityn_water=Coverage increases the unicomp sea area; scale changes the size of land districts. The initial dry landing core is preserved.
quinityn_cliff=Controls cliff frequency and continuity on Quinityn. The landing core remains cliff-free.
quinityn_enemy_base=Controls Quinityn biter nest frequency and size independently of Nauvis.

