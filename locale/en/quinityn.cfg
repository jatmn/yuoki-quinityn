[mod-name]
yuoki-quinityn=Yuoki Industries: Quinityn

[space-location-name]
quinityn=Quinityn

[space-location-description]
quinityn=A forgotten Yuoki Industries contract world. Durotal and Nuatreel outcrops rise from purple liquid unicomp seas. Recover the abandoned industrial base, contain the biters, and manufacture your own passage to orbit.

