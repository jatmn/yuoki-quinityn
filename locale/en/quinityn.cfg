[tips-and-tricks-item-description]
quinityn-briefing=Quinityn appears in YuokiTani's original 2015 stories as a Yuoki Industries contract world. This addon imagines the industrial landscape left behind.\n\nResearch its discovery and fly from Nauvis. Physically landing a character unlocks the field survey for your entire force. Viewing the surface remotely does not count. Yuoki research then applies on every world.\n\nYou may arrive empty-handed. The starting plateau has N4, F7 and a unicomp inlet. Existing vanilla research is retained; a force with no research can also bootstrap. No spawn-changing mod is required.\n\nThese chapters appear as you reach their relevant technologies and remain in Tips and Tricks for reference.
quinityn-bootstrap=Mine the irregular N4/F7 deposits near your landing site. Each holds roughly 125,000–150,000 units. Nearby clustered [entity=quinityn-wreck] provide extra salvage. Use [recipe=quinityn-hand-sort] (the salvage icon) in the Yuoki crafting tab to sort wreck salvage into N4, F7, stone and wood. Hand-sort initial iron ore, copper ore, stone, coal and timber. These emergency recipes cannot be automated.\n\nBuild [item=quinityn-burner-separator], find the natural unicomp coastline, and connect an offshore pump to its input. Burn raw [item=y-res2] (1 MJ), wood or coal. This primitive Cimota separates 100 water every 4 seconds without electricity. Feed a boiler and steam engine, then build your first labs, crusher and form press. There is no artificial starter pond.\n\nThe 80-tile dry core protects the initial deposits; the coastline beyond it follows the natural warped terrain.
quinityn-unicomp=[font=default-bold]There is no natural water[/font]\nPlace [entity=offshore-pump] at the purple sea. Its output is [fluid=y-liquid-uc2], not water. Pipe it into [entity=quinityn-burner-separator], select [recipe=quinityn-water], insert raw F7, wood or coal, and connect the output to your boiler. The recipe consumes 1 unicomp fluid to produce 100 water in 4 seconds.\n\nSeparate the input and output pipe networks. A boiler cannot use unicomp. Expand separator capacity when crushers and farms also need water.\n\n[font=default-bold]Disposal[/font]\nPoint an inserter at a unicomp tile to dissolve surplus items permanently, as with Vulcanus lava. Filter it carefully. Dumping items does not recover unicomp and does not consume the sea. Ordinary landfill and normal foundations cannot cover unicomp. Research [technology=quinityn-foundation] and use [item=quinityn-foundation] to expand.
quinityn-materials=Crush N4 and F7, then use [item=y-heat-form-press] for refined materials. Build reactor fuel to earn [item=y_rwtechsign] as a byproduct.\n\nResearch vanilla Circuit network and manufacture [item=ye_fassembly1] using MF parts, chips, reinforced gears and an arithmetic combinator. Its recipe is available from [technology=quinityn-materials], before any research that requires Quinityn science.\n\n[recipe=quinityn-research-data] combines a Durotal block, compressed F7 and a Technic Sign into five science bottles. It runs only in [item=ye_fassembly1], [item=ye_fassembly2] or [item=ye_fassembly_sp], on Quinityn. Neither hand crafting nor vanilla assemblers can make it.\n\nFor signs without byproducts, use [recipe=quinityn-technic-sign] in those same factories: 12 reinforced gears, 8 Durotal structures, 20 conductive wire and 4 basic Yuoki chips for one sign, with 30 seconds of recipe work. Reactor-fuel byproducts remain the economical early option.
quinityn-power=The first steam network starts your factory. [technology=quinityn-power] then opens Yuoki fuel preparation, generators, accumulators, lamps and fluid infrastructure.\n\nUse crushed and compressed fuels to improve energy density and supply a dedicated fuel belt. Buffer fuel and water before expanding your electric load.\n\nA researched machine can still require a material made in a later discipline: inspect its ingredients in Factoriopedia. Start with affordable boilers and generators. Crystal accumulators and other advanced devices become practical after crystal processing.\n\nMF-only generators require Mechanical Force fluid from the Engines chain; water or steam is not a universal substitute.
quinityn-cimota=Build [item=y-atomic-constructor] from an assembling machine 2, crusher, press and reactor fuel.\n\nPump [fluid=y-liquid-uc2] into the Cimota and choose [recipe=y-liquid2uc] to recover solid [item=y-unicomp-a2]. The existing Yuoki conversion is 5 fluid to 25 solid UC-A2. Reconstruct ore, timber and crude oil with the original Yuoki recipes. Ocean material is abundant; machinery, power and logistics determine throughput.\n\n[font=default-bold]No oil well required[/font]\nResearch Oil gathering, then make 80 crude oil with [recipe=y-uc2crudeoil]. [technology=quinityn-oil-processing] completes normal Oil processing. You can now construct refineries and chemical plants and progress toward plastic, sulfur, acid, advanced circuits and chemical science.\n\nThis alternate trigger exists because Quinityn has no crude oil deposit to mine.
quinityn-engines=Mechanical Force, [fluid=y-mechanical-force], represents the Engines power transmission system. Its temperature matters to downstream machinery and generators.\n\nBuild the machine parts and a suitable MF source, then connect compatible engines, gearboxes and generators with pipes. Select the conversion recipe and supply its exact fuel, water or lubricant requirement.\n\nElectric motors consume grid energy to supply MF. Fuel engines provide another route. Turbines produce condensate: drain or reuse it so a full output does not stop the turbine.\n\nDo not assume an engine icon means it generates electricity directly. Follow fluid input/output arrows in Factoriopedia and use a generator designed for that fluid and temperature. Quantrinum reactors belong to the later quantum stage.
quinityn-refining=Yuoki refining expands the factory from ore handling into contaminated-water recovery, emulsions, catalysts and industrial smelting.\n\nUse [item=y-dirtwasher] to recover useful fractions and crystals. Read every recipe's outputs before connecting belts and pipes: solids and contaminated water need independent exits.\n\nFollow recovered materials into catalysts, mixers and [item=y_smelter]. Keep a buffer for each intermediate so one full output cannot halt an entire chain.\n\nConvert reusable waste where economical. Send truly unwanted solids to a filtered shore inserter. Maintain your clean-water loop separately from contaminated water and unicomp.
quinityn-agriculture=Engines adds its own biology: corn, Vugar, Trifitan, Rabio, vegetable oils, animals and DNA. These are Yuoki production lines, independent of Gleba farming.\n\nBegin with [item=ye_farm], the seed recipes and a steady water supply. Reserve seeds for replanting before processing the harvest. Develop Vugar and corn products into industrial material, synthetic wood, fuel or feed.\n\nThe DNA, meat and fish branches use different inputs; unlock their machine recipes and follow the ingredient links. Some breeding recipes require an initial specimen or trade before they can multiply it.\n\nThe Trade Node becomes available here for the agricultural chain. Large export operations and Laika trade are developed later. Agriculture is useful industry, but it is not an import requirement for your first rocket.
quinityn-logistics=Yuoki inserters, storage and robot infrastructure support expanding districts. Manufacture the underlying N4/F7 structures and electronic parts before scaling advanced machines.\n\nKeep the water-separation district, MF network, refining and farms supplied independently. Filter shore disposal so science, catalysts, fuel and seed reserves cannot be thrown away accidentally.\n\nBiters can attack transport corridors. Build defended routes between industrial islands and use Quinityn foundations where you need a reliable crossing. This planet does not require elevated rails to reach its first resources.
quinityn-defense=Quinityn is an industrial wasteland: ash, slag, ruined machinery and smog. There are no forests, and the contaminated ground and sea absorb almost no pollution. Quinityn has native biters, spitters and worms. Industrial pollution attracts them; this is not a peaceful ruin world.\n\nStart with locally made vanilla ammunition, turrets and walls while developing [technology=quinityn-defense]. Yuoki then provides stronger walls, specialized ammunition, weapons, turrets and equipment.\n\nMatch each turret to its ammunition or fluid. Protect the bootstrap water and fuel lines first: losing them can shut down power and the machines needed to repair your defense.\n\nKeep repair stock and spare ammunition outside production buffers. The infinite plasma research provides an ongoing use for Quinityn science later.
quinityn-quantum=Refined N4/F7, crystals and Technic Signs lead into [item=y-atomic-quantum-composer], [item=y-alien-infuser], [item=y-quantrinum] and advanced electronics.\n\nBuild the preceding ore and crystal lines first, then commission the composer and infuser. Supply their actual recipe ingredients; the purple ocean supplies matter, not finished high-tier components.\n\nScale [item=y-chip-2], conductive parts and structural materials for advanced machines and orbital manufacturing. Keep power reserves before starting high-consumption processes.\n\nMerchant reputation and Technic Signs are separate resources. Do not substitute one for the other when a machine or recipe asks for a specific sign.
quinityn-trade=The [item=y-stargate] is the Laika-Gate, named in the original mod in memory of Laika. Yuoki's trade fiction connects your factory to other worlds with demand for raw materials and manufactured goods.\n\nUse the existing recipes to manufacture exports, earn [item=ypfw_trader_sign] and reputation, and obtain specialized imports. Follow the food and package chains through the Engines Trade Node.\n\nA trade is a recipe with real material costs; inspect both outputs and byproducts. Reputation is not the same as UC-A2. Some profitable loops are part of Yuoki's original design.\n\nYour first rocket can be built without importing resources through either a platform or the trade network.
quinityn-mastery=Mastercrafted machines and ultimate products reward a developed Yuoki economy. They consume the advanced materials and signs earned by preceding industries.\n\nExpand a working chain before replacing every machine with a larger version. Verify its power or MF input, fuel, output capacity and module support.\n\nKeep [item=quinityn-research-data] automated on Quinityn. It is not only a progression item: your endgame mining and plasma technologies consume it indefinitely.
quinityn-orbital=Your launch chain is entirely local: N4/F7 and salvage → plates and structures; unicomp → crude oil → petroleum, plastic, sulfur and acid; advanced circuits → processing units; oil and Yuoki fuel processing → rocket fuel.\n\nFollow the normal rocket-silo technology prerequisites. Make the silo, concrete, electric engines, processing units, low density structures and rocket fuel locally. Supply electricity and assemble the rocket normally. You do not need other-planet resources or trade imports.\n\n[technology=quinityn-orbital] adds [recipe=quinityn-low-density-structure] and [recipe=quinityn-processing-unit], using Durotal structures and Yuoki chips. Vanilla local recipes remain available.\n\nBuild or retain an orbital platform to receive your launch and export science. This mod does not create a rescue platform for you.
quinityn-endgame=[font=default-bold]Keep Quinityn working[/font]\n[item=quinityn-research-data] can only be manufactured on Quinityn. Export it to your research center or import other science to local labs.\n\n[technology=quinityn-mining-productivity] adds 10% mining productivity per level. [technology=quinityn-plasma-damage] adds 10% Yuoki plasma ammunition damage per level. Both are infinite.\n\nEach starts at 1,000 research units. Every unit consumes two Quinityn data packs and one of each standard red, green, blue, purple, yellow and space science pack. Cost grows by 50% every level.\n\nA sustained N4/F7 processing and Technic Sign industry therefore remains useful after every finite Quinityn technology has been completed.
quinityn-foundation=The purple sea dissolves ordinary fill. [item=landfill] and [item=foundation] cannot cover it. Your starting plateau has enough room to bootstrap, but expansion across liquid requires [item=quinityn-foundation].\n\nAfter [technology=quinityn-refining], research [technology=quinityn-foundation]. Use a Yuoki form press on Quinityn: 2 Durotal structure elements + 1 pressure-proof element + 5 Orange Stuff + 10 stone bricks → 4 foundations in 8 seconds.\n\nThese are a separate item and tile with their own mining return. They retain normal foundation's terrain support and freeze/thaw behavior. They work anywhere normal foundations work, plus unicomp seas. Export them as an alternative for building on other planets.\n\nLeave accessible coastline for offshore pumps and filtered disposal inserters. Covering every inlet would remove the source of your industrial water and matter.

