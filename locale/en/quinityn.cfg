[technology-description]
quinityn-air-scrubbing=Use a Fatmice Cycle Engine without filters to collect flyash while removing pollution. Supply electricity, water and Mechanical Force from the small electric motor. Unlocks the motor, its components and conversion recipe. Reserve 100 rock ash for Power and this unlock. One unfiltered Fatmice supplies 30 science packs per minute, using 30 water per second and 1.25 MW while working, plus the motor and water supply. Expand both power and water before scaling.
quinityn-air-filters=Upgrade the Fatmice with reusable filters. A filtered capture takes 10 seconds and removes twice as much pollution while running. Wash each dirty filter with 110 water and 8 coal dust to recover a clean filter and 6 flyash, with no wastewater. Use one washer per continuously running Fatmice and at least two circulating filters plus transport buffers. This loop supplies 36 science packs per minute, using 17 water per second and 48 coal dust per minute. Return clean filters and prioritize ash for science before rocket fuel. The basic unfiltered mode remains available.
quinityn-pressing=Crush 50 N4 to unlock the heat form press. Press crushed N4 and F7 into refined materials; compaction is the next separate step.
quinityn-compacting=Produce 30 refined N4 to unlock Durotal blocks and Fuelnium. Use the heat form press for both compressed products.
quinityn-alloying=After learning pressing, crush 50 F7 to unlock rich dust mixing and Orange Stuff smelting. Electronics follows once Orange Stuff is in production.
quinityn-structures=Make 20 Durotal blocks to unlock structural elements, pressure-proof elements and reinforced gears. These components support the first factory.
quinityn-electronics=Smelt 30 Orange Stuff to unlock conductive wire, chip plates and basic chips. Combine these with the structural branch before building a factory.
quinityn-fuel-processing=Press 10 Fuelnium to unlock reactor-fuel manufacture. This recipe also earns Technic Signs; keep them for industrial research data.
quinityn-basic-factory=After structural and electronic processing, make 20 basic chips to unlock MF components and the first Yuoki factory. Vanilla Circuit network supplies its arithmetic combinator. Mining an ash-coated Quinityn rock reveals science separately; this factory is required to manufacture it.
quinityn-industrial-science=Mine an ash-coated Quinityn rock after landing to discover industrial research data. The first flyash sample reveals how the old atmosphere can be studied and reclaimed. Combine 5 flyash, 1 Durotal block, 1 compressed F7 and 1 Technic Sign into 5 bottles. The recipes are revealed immediately; production still requires a Yuoki factory and its material chain. All later lab-based Yuoki research requires these bottles.
quinityn-plant-infrastructure=Build Yuoki pipe networks, tanks, substations and industrial lighting after establishing basic power and advanced components. Vanilla pipes and poles remain sufficient for the initial factory.
quinityn-excavation=Upgrade the basic mining drill to electric excavation, then build an underground drill. Start with plain dirt digging; drill-head-assisted digging follows Tool-assisted processing.
quinityn-washing=Build a dirt washer, purify iron and copper ore with water, and smelt that pure ore into plates. Release contaminated water into mud and toxic dust, filter mud for crushed N4 and F7, and press mud dry. Tool-assisted washing, dirt archaeology, unicomp compression, slag products, and paving are separate later research.
quinityn-archaeology=After plain excavation and ore washing, wash dug dirt in the dirt washer. One recipe returns stone, ancient data fragments, and contaminated water. The other returns contaminated mud. Use the contaminated-water and mud recipes from ore washing as the waste outlets. Fragments are the only local supply for later quantum recipes. The mastercrafted washer stays on its own later research.
quinityn-unicomp-compression=Press 20 rich dust in the heat form press into one solid unicomp and one slag. This does not unlock Cimota reconstruction or ocean-unicomp solidification. Those remain Cimota research.
quinityn-slag-materials=Crush pressing slag into granulate, press granulate into slag bricks, and smelt slag bricks into stone bricks. Crush stone bricks into stone flour for air filters and mineral emulsions. Rich-dust compression is not required. Contract-world defense, reusable filters, and crystal processing wait for this research so their brick and stone-flour recipes can be crafted.
quinityn-slag-paving=After slag materials, press slag bricks into brick tiles and patterned tiles, and press raw slag into filled slag tiles. These paths are optional.
quinityn-tooling=Make tool heads and drill heads, then switch to their assisted crushing, purification and digging recipes. Collect broken heads; the later Maintenance workshops research recovers them.
quinityn-advanced-machining=Upgrade the first crusher and form press to their second-tier machines. This improves machinery separately from consumable tool-head processing.
quinityn-advanced-components=Use local petrochemistry for electrical structures and second-tier mechanical parts. Build advanced chips, coils, cold blocks and magnetrons for later machinery. Hot-block charging is part of thermal smelting research.
quinityn-maintenance=Build a maintenance workshop from an advanced form press and industrial components. Repair broken tool heads and drill heads using repair tools and recovered materials.
quinityn-energy-storage=Produce disposable battery stages, capacitor blocks and the first small accumulator. Larger accumulators, flywheel buffers and high-flow compensators have separate research.
quinityn-advanced-storage=Upgrade the small and large accumulators using conductive crystals and advanced chips. Requires large-accumulator research and Quantrinum. Quantum-scale storage remains a later step.
quinityn-reactors=Prepare first-tier mixed-oxide fuel, process it in the reactor chain, and recover usable fuel. Build the Obninsk reactor, advanced containment walls and graphite pressing for fuel. Infused fuel follows Quantum power. Durotal walls are a separate earlier research; this technology still unlocks the Krakon wall.
quinityn-quantum-power=Use infused materials for quantum-scale accumulators, solar generation, substations, second-tier mixed-oxide fuel and the advanced Obninsk turbine.
quinityn-fluid-handling=Build the canning machine and ice maker, produce seals and containers, and fill or empty industrial fluids. Biological contents become available as their own branches develop.
quinityn-advanced-factories=Unlock the Y2-Factory as the second factory tier. Obtain Scientific Reputation from existing production byproducts, such as radar construction or Quantrinum production. P3 and the research center have separate later unlocks.
quinityn-p3-factory=Unlock the P3-Factory after advanced engines and Yuoki speed module 2, which requires space science. Research costs 1,000 each of automation, logistic, chemical, production, utility and Quinityn science, at 30 seconds per unit. Scientific Reputation byproducts supply its existing recipe before the research center is available.
quinityn-research-center=After the P3-Factory and Mastercrafted industry, build the research center to generate Scientific Reputation directly. This endgame research costs 5,000 each of automation, logistic, military, chemical, production, utility, space and Quinityn science, at 40 seconds per unit. Existing production byproducts remain available earlier.
quinityn-advanced-engines=Build the fluid-fuel engine and the gas engine. Keep heavy oil, light oil, corn oil, petroleum gas, and hydrogen with the engine that burns them. The medium electric motor, heat generator, overheater, steam turbine, and high-temperature generators are separate researches.
quinityn-advanced-transmission=Craft the three green transport tubes in a foundry. Those recipes consume tungsten plate and use metallurgy. Sheet metal unlocks here because the green tubes consume it; the sheet itself stays a form-press recipe. Red Mechanical Force shafts stay with the first engine research.
quinityn-medium-mf-pump=Build the speed-4 mechanical pump after the first speed-1 pump. Its recipes turn water into Mechanical Force and Mechanical Force into water.
quinityn-substrat-neutralization=After genetics grows Substratin, neutralize sulfuric acid and Substratin into concentrated water and Mechanical Force. The first engine research does not grant this recipe.
quinityn-medium-electric-motor=Build the 350 kW medium electric motor and its Mechanical Force recipe. This uses grid power. It does not include the 6 MW heat generator.
quinityn-mf-heat-generator=Turn one medium electric motor into the 6 MW heat generator and run that generator's Mechanical Force recipe. The motor research does not grant this machine.
quinityn-steam-overheating=Build the 28 MW overheater and boil water into 500 C steam. The steam turbine is a separate research.
quinityn-steam-turbine=Build the steam turbine. 560 steam at 500 C or hotter yields 25 Mechanical Force. 800 steam at 950 C or hotter yields 75 Mechanical Force. The hotter recipe is a different operating requirement, not an unconditional upgrade.
quinityn-high-temperature-generation=Build the Mechanical Force generator and the high-temperature steam turbine. The turbine construction consumes five medium electric motors. This is separate from the four earlier electrical generators.
quinityn-crystal-processing=Prepare mineral emulsions, pressurize them and crystallize concentrated material. Recover N4/F7 chunks and establish the crystal supply for quantum research.
quinityn-husbandry=Build the meat farm, pool and DNA splicer. Establish basic animal DNA, meat, blood, slurry and fish production before moving to engineered species.
quinityn-genetics=Develop the first engineered Krakon livestock and cultured plants from basic animal and crop stock. Establish omtrinit, substrate and cell production before later mutations.
quinityn-advanced-genetics=Develop second-generation livestock, specialized feeds and carnivorous plants. Produce verotin and chitrotin for more demanding industrial contracts.
quinityn-industrial-biology=Raise the final engineered livestock tier using advanced biological products. Recover organic metal and industrial fluids from this demanding production chain.
quinityn-advanced-logistics=Upgrade fast inserters to smart, long and directional versions using infused materials. First-tier storage and inserters remain in Logistics.
quinityn-robotics=Unlock the Yuoki roboport and first construction and logistic robots. Research requires automation, logistic, chemical and Quinityn science. The 8080 network expander has a separate unlock. Produce 500 YI Logistikers after this research to open advanced robot research.
quinityn-robot-network-expansion=Unlock The 8080 after Yuoki robotics to extend your robot network. Costs 300 each of automation, logistic, chemical and Quinityn science. Advanced robots follow their own manufacturing milestone and research.
quinityn-robot-production=Craft 500 YI Logistikers after Yuoki robotics to qualify for advanced robot research. Production is shared by your force; existing stock does not count. This milestone unlocks no recipes and consumes no science. The advanced robot models still require separate lab research.
quinityn-advanced-robotics=After producing 500 YI Logistikers, research upgraded construction and logistic robots using conductive crystals and advanced mechanical parts. Costs 1,000 each of automation, logistic, chemical, production, utility and Quinityn science.
quinityn-advanced-defense=Unlock the Maudlin bullet turret and its standard, acid, poison, impact, explosive, and tracer ammunition. Lasers, plasma, chemical weapons, mines, artillery shells, and the D-ZTT are separate research.
quinityn-durotal-walls=Upgrade a brick wall into a Durotal wall. Krakon containment walls remain part of mixed-oxide reactor research.
quinityn-forcefield-walls=Build a Vitduo forcefield wall from a Durotal wall and conductive coils.
quinityn-hardic-walls=Build the 4,000-health Hardic wall from structure vessels, concrete, and rich dust. It does not consume an earlier wall.
quinityn-ammunition-cases=Craft round metal cases for plasma capsules, blaze canisters, and Yuoki artillery shells. Bullet cases stay with the first defense research.
quinityn-laser-turret=Build the Eisenwulf laser turret. It has no ammunition item.
quinityn-plasma-weapons=Build the plasma turret and craft plasma capsules from round metal cases.
quinityn-chemical-weapons=Build the SKleen chemical turret and craft the blaze canisters it consumes.
quinityn-poison-mines=Craft Poison Mines from blaze canisters.
quinityn-plasma-mines=Craft Plasma Mines from plasma capsules.
quinityn-artillery-shells=Craft Yuoki artillery shells after vanilla artillery and round metal cases. The shell is ammunition for the artillery weapon.
quinityn-zero-time-weapon=Build the D-ZTT from Krakon walls, an advanced accumulator, and infused unicomp. Quantum power systems no longer unlock this weapon.
quinityn-powered-armor=Build the first Yuoki armor suit and its basic battery, shield, movement and weapon equipment. The personal laser defense is built from the Eisenwulf turret, so that turret research comes first. Later suit and shield tiers require separate research.
quinityn-armor-2=Upgrade the gray suit to red armor and fit second-tier shields.
quinityn-armor-3=Upgrade red armor to the gold suit before constructing a walker.
quinityn-walker-1=Build the first walker from gold armor and mastercrafted equipment.
quinityn-walker-2=Upgrade the first walker to the final heavy suit.
quinityn-modules=Unlock the first Yuoki speed module. Costs 50 each of automation, logistic and Quinityn science, at 30 seconds per unit. Efficiency and productivity have separate research lines.
quinityn-advanced-modules=Upgrade the first speed module with advanced chips and combined crystals. Costs 200 each of automation, logistic, chemical, space and Quinityn science, at 30 seconds per unit.
quinityn-efficiency-module=Unlock the first Yuoki efficiency module. Costs 50 each of automation, logistic and Quinityn science, at 30 seconds per unit.
quinityn-advanced-efficiency-module=Upgrade the first efficiency module. Costs 200 each of automation, logistic, chemical, space and Quinityn science, at 30 seconds per unit.
quinityn-productivity-module=Unlock the T&O productivity module. Costs 50 each of automation, logistic and Quinityn science, at 30 seconds per unit.
quinityn-advanced-productivity-module=Upgrade T&O modules into Coolaid productivity modules. Costs 200 each of automation, logistic, chemical, space and Quinityn science, at 30 seconds per unit.
quinityn-quantum-modules=Upgrade Coolaid modules into Mantis-S productivity modules. Costs 300 each of automation, logistic, chemical, production, space and Quinityn science, at 60 seconds per unit.
quinityn-combined-module=Combine second-tier speed and efficiency modules into Just Techanic! modules. Requires both research lines and 1,000 each of automation, logistic, chemical, production, utility, space and Quinityn science, at 60 seconds per unit.
quinityn-ultimate-efficiency-module=Advance from second-tier efficiency modules and Mastercrafted industry to Green Ultimate Product modules. Costs 5,000 each of automation, logistic, chemical, production, utility, space and Quinityn science, at 60 seconds per unit.
quinityn-science-module=Develop Science Baby! after second-tier speed and efficiency, Mantis-S productivity and Mastercrafted industry. Costs 5,000 each of automation, logistic, chemical, production, utility, space and Quinityn science, at 60 seconds per unit.
quinityn-quality-module=Develop the powerful YI Quality Module after Mantis-S productivity, vanilla quality module 2 and Mastercrafted industry. Costs 5,000 each of automation, logistic, chemical, production, utility, space and Quinityn science, at 60 seconds per unit.
quinityn-packaging=Prepare containers and package farm, fish and biological products for the later export contracts. Packaging recipes require their corresponding production branches to supply the contents.
quinityn-advanced-generation=Unlock the small Generator-S. Medium, big and huge Generator-S sizes, the high-capacity boiler, high-pressure steam turbine and electric water generator are separate researches.
quinityn-compressed-fuel=Compress coal briquettes into denser fuel stacks after basic power is established.
quinityn-mixed-fuel=Mix coal dust into loaded mixed fuel. The unloaded mixed fuel has no fuel value, so both the unloaded intermediate and the loaded fuel step unlock together.
quinityn-residue-fuel=Press dried mud into unloaded mixed fuel, which has no fuel value until it is loaded. Requires ore washing and loaded mixed fuel.
quinityn-field-repair=Craft Durotal repair tools from one repair pack and one Durotal block. Maintenance workshops remain a later research.
quinityn-solar-dish=Build the basic Stirling solar dish for early solar power.
quinityn-solar-collector=Build the 1 MW alien solar collector after the dish. The 2 MW collector remains on Quantum power systems.
quinityn-accumulator-capacity=Build the 18 MJ large accumulator after first-tier storage.
quinityn-flywheel-storage=Build the 40 MJ flywheel buffer with 0.75 MW charge and 1.5 MW discharge limits. It is a specialist buffer, not a higher tier of the smaller accumulators.
quinityn-high-flow-storage=Build the high-flow compensator after Large accumulator and Flywheel buffer research.
quinityn-medium-generation=Unlock the medium Generator-S. Capacitor blocks remain an ingredient gate.
quinityn-big-generation=Unlock the big Generator-S after the medium machine.
quinityn-huge-generation=Unlock the huge Generator-S for higher mechanical-force throughput at 0.88 effectivity versus 0.95 on the small and medium machines.
quinityn-high-capacity-boiler=Build the high-capacity boiler for 265°C steam. Parallel to the small Generator-S gate.
quinityn-high-pressure-steam-turbine=Build the high-pressure steam turbine rated for 265°C steam from the high-capacity boiler. The emergency generator on Yuoki power is the 165°C machine.
quinityn-electric-water=Upgrade the basic water generator to electric operation. Parallel to the small Generator-S gate.
planet-discovery-quinityn=Locate Quinityn, the world named in the recovered Yuoki Industries stories. Travel from Nauvis. Landing there opens Yuoki progression for your force; discovering it from orbit does not.
quinityn-arrival=Research Quinityn discovery, then physically land on Quinityn. Mine N4 and F7 or collapsed stockpiles. Hand-sort ore, carbon and stone, build a furnace, and assemble a primitive Cimota Restructor. Nothing needs to be imported. Crafting that machine also completes [technology=quinityn-surplus] for surplus stone and wood conversions before Quinityn science.
quinityn-surplus=Craft a [entity=quinityn-burner-separator] after landing. In that primitive Cimota, turn 40 stone or 40 wood into 1 UC-A2, then 1 UC-A2 into 10 coal, iron ore or copper ore, with no Quinityn science packs. The later [technology=quinityn-cimota] Cimota Restructor runs the same basic conversions faster and at better yield, and keeps ocean reconstruction and advanced conversions.
quinityn-materials=Craft a primitive Cimota Restructor after landing to unlock the first crusher, wet N4/F7 crushing and the burner mining drill. Pressing, compaction, components and factories have later crafting milestones. Mine an ash-coated Quinityn rock to reveal science.
quinityn-power=Use Quinityn science for basic coal fuel, wooden briquettes, the emergency steam generator, plated heat exchangers and early fuel-to-electricity. Compressed fuel, mixed fuel, solar, repair tools, storage, advanced generators and plant infrastructure have separate research branches. Advanced machines may require materials from later disciplines. Steam is your bootstrap; Mechanical Force is your industrial future.
quinityn-cimota=Build a Cimota Restructor. Solidify pumped unicomp, reconstruct raw materials and crude oil, and feed conventional chemistry. Industrial research data comes from the preceding N4/F7 chain.
quinityn-engines=Build the first solid-fuel engine, its water and dry operating recipes, the tiny Stirling engine, the speed-1 mechanical pump, orange transport tubes, blue and red shafts, gauges, and the flyash mixed-fuel and rocket-fuel recipes. The small electric motor and Fatmice stay on air scrubbing. The medium pump, medium electric motor, heat generator, steam equipment, liquid-fuel engines, and green tubes are separate researches.
quinityn-refining=Scale fluid and fuel production through Yuoki chemistry, catalysts, wood granulation, toxic-dust acid and the basic water generator. Thermal smelting, slurry syngas, biological feedstock, foundry melting and asteroid crushing are separate researches. Crystal and emulsion machinery follows its own research.
quinityn-thermal-smelting=Build the Yuoki smelter and the heat charger, charge cold blocks into hot blocks, and smelt pure copper, pure iron and steel. This follows industrial refining and [technology=quinityn-quantum], because the charger needs data crystals from the quantum composer. Chemical refining stays available without Quantum.
quinityn-biological-feedstock=After crop production, crush corn, Vugar, Trifitan cellulose and Rabio into organic dust. Chemical refining no longer grants these recipes.
quinityn-slurry-syngas=After husbandry produces slurry, convert [fluid=ye_slurry] and [item=ye_sugar] into [fluid=y_syngas_raw]. Crop granulation remains the earlier biological step.
quinityn-foundry-melting=Melt pure iron and pure copper in a foundry. This requires the foundry and calcite. Industrial refining does not grant these recipes.
quinityn-asteroid-crushing=Crush metallic, carbonic and oxide asteroid chunks into N4 and F7 with a space crusher. This is separate from the Yuoki ore crusher. Crushing needs [technology=space-platform] research. Planet discovery only enables travel to space platforms.
quinityn-agriculture=Grow corn and Vugar, prepare synthetic wood and oils, and establish crop production. Husbandry and genetic engineering follow later. Water comes from your separator; it is not a natural ocean resource here.
quinityn-logistics=Build the 60-slot chest, the fast inserter, and the long inserter. Larger chests, logistic storage, and requester or buffer chests are separate researches. Smart inserters and robot networks stay on their own branches.
quinityn-expanded-storage=After Yuoki logistics, build the 100-slot chest. The 60-slot chest and both basic inserters stay on Yuoki logistics.
quinityn-large-storage=Build the 140-slot chest after the 100-slot chest. This is ordinary storage, not a logistic-network chest.
quinityn-bulk-storage=Build the 220-slot chest after the 140-slot chest.
quinityn-logistic-storage=Build the 60-slot passive provider and the 60-slot logistic storage chest. Both consume one 60-slot chest. Requester and buffer chests are a later research. Vanilla logistic robots are already available from the discovery path.
quinityn-logistic-provider-capacity=Build the 70-slot passive provider after the first Yuoki logistic storage chests.
quinityn-logistic-bunker=Build the 140-slot logistic storage bunker. It consumes one 140-slot chest, so that ordinary chest comes first. This is storage, not a requester or buffer.
quinityn-logistic-requests=Build the 60-slot requester and buffer chests after Yuoki logistic storage, Yuoki robotics, and vanilla Logistic system. Passive providers and storage chests do not require Logistic system.
quinityn-wide-logistic-requests=Build the 70-slot requester and buffer chests after the 60-slot requester and buffer research.
quinityn-defense=Build a wooden palisade, a brick wall, bullet cases, the BruteMan cannon turret, and Yuoki cannon shells. Durotal and later walls, Maudlin bullet types, and other weapons are separate research. Pollution attracts native biters.
quinityn-quantum=Build the quantum composer and infuser after crystal processing, first-tier energy storage, high-flow compensator and dirt archaeology research. Develop conductive crystals, Quantrinum and infused materials for advanced modules, power and equipment branches.
quinityn-trade=Connect to the Laika network. Export prepared packages, earn Merchant Signs and reputation, and trade for specialized materials. Trade is optional for launching a rocket from local resources.
quinityn-mastery=Commission mastercrafted machines and Yuoki ultimate products. This is the mature industrial economy beyond basic survival and orbital access.
quinityn-orbital=Use Durotal structures and Yuoki chips in rocket component production. Standard locally manufactured rocket components are also available through the vanilla technology tree.
quinityn-oil-processing=Reconstruct crude oil in a Cimota Restructor. This completes Oil processing without requiring a crude oil deposit, allowing an entirely local start on Quinityn.
quinityn-mining-productivity=Repeatable endgame research: +10% mining productivity per level. Each research unit consumes two Quinityn industrial research data plus the six standard sciences. Cost grows by 50% per level. Keep Quinityn producing and exporting science throughout the endgame.
quinityn-plasma-damage=Repeatable endgame research: +10% Yuoki plasma ammunition damage per level. Consumes Quinityn industrial research data and the six standard sciences, with 50% greater cost per level. Supports the continuing defense of your industrial empire.
quinityn-foundation=Make foundations locally in Yuoki form presses from Durotal structures, pressure-proof elements, Orange Stuff and stone bricks. Required to expand over unicomp seas. These foundations also cover every terrain supported by ordinary foundations, without requiring Aquilo materials.

